<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Yang Gyunam</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <!-- Language Toggle Button -->
    <div class="lang-toggle" onclick="toggleLanguage()">
        <span class="lang-ko">한</span>
        <span class="lang-en">EN</span>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="site-header">
                <a href="/" class="site-title">Yang Gyunam</a>
                <div class="site-tagline">Software Engineer</div>
            </header>

            <nav class="navigation">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/projects/">Projects</a></li>
                    <!-- <li><a href="/articles/">Articles</a></li> -->
                    <li><a href="/games.html">Games</a></li>
                    <li><a href="/#contact">Contact</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <article class="entry">
                <h1 class="entry-title">Projects</h1>
                <div class="entry-meta">Featured Work</div>
                <div id="projects-list" class="entry-content">
                    <!-- Will be populated by JavaScript -->
                </div>
            </article>

            <footer>
                <p>Copyright © 2025 - 2026 Yang Gyunam</p>
            </footer>
        </main>
    </div>

    <script src="../scripts/main.js"></script>
    <script>
        async function loadProjects() {
            const projects = await loadJSON('../data/projects.json');
            const container = document.getElementById('projects-list');
            const lang = currentLang;

            const linkIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /></svg>';

            container.innerHTML = '<ul class="post-list">' + projects.map(project => {
                return `
                    <li class="post-item">
                        <h2 class="post-title">
                            <a href="${project.id}.html">${project.title[lang]}${linkIcon}</a>
                        </h2>
                        <div class="post-date">${formatDate(project.date, lang)}</div>
                        <div class="post-description">${project.description[lang]}</div>
                        ${project.tags ? `<div class="post-tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
                    </li>
                `;
            }).join('') + '</ul>';
        }

        // Update content on language change
        window.addEventListener('languageChanged', function(e) {
            loadProjects();
        });

        // Initial load
        loadProjects();
    </script>
</body>

</html>
